<div class="roomly-login-page">
  <form data-form="login" class="auth-form roomly-login-shell" novalidate action="api/index/auth/login" method="post" data-ajax-submit="true" data-redirect="/" data-auto-fill-intended-url="true"
        data-load-api="api/index/config/login" data-load-cache="true" data-load-cache-time="300000">
    <!-- Brand panel. Hidden below 760px, where .roomly-login-mobile-brand takes over. -->
    <aside class="roomly-login-visual">
      <div class="roomly-login-visual-brand">
        <span class="roomly-login-visual-logo">
          <img src="/images/logo.png" alt="{LNG_ระบบจองห้องคณะสัตวแพทยศาสตร์}">
        </span>
        <div class="roomly-login-visual-name">
          <h2 data-i18n>Room booking system of the Faculty of Veterinary Medicine</h2>
          <p data-i18n>Chiang Mai University</p>
        </div>
      </div>
    </aside>
    <section class="roomly-login-panel">
      <div class="roomly-login-utilities">
        <button class="roomly-language-toggle" type="button" data-roomly-language-toggle aria-label="Switch language">
          <span class="roomly-language-icon icon-language"></span><span class="roomly-language-option roomly-language-th">TH</span><span class="roomly-language-divider">/</span><span class="roomly-language-option roomly-language-en">EN</span>
        </button>
        <button class="roomly-icon-button roomly-theme-toggle" type="button" data-roomly-theme-toggle aria-label="Toggle theme">
          <span class="roomly-theme-glyph roomly-theme-moon icon-night"></span><span class="roomly-theme-glyph roomly-theme-sun icon-day"></span>
        </button>
      </div>
      <div class="roomly-login-form-card">
        <div class="auth-header roomly-login-header">
          <a href="/" class="roomly-login-mobile-brand" aria-label="{LNG_ระบบจองห้องคณะสัตวแพทยศาสตร์}">
            <img class="roomly-brand-logo roomly-login-brand-logo" src="/images/logo.png" alt="{LNG_ระบบจองห้องคณะสัตวแพทยศาสตร์}">
          </a>
          <h1 class="roomly-login-title" data-i18n>Log in</h1>
          <p class="login-message" data-i18n>Use your Chiang Mai University account</p>
        </div>

        <!-- Microsoft SSO only -->
        <fieldset class="center roomly-microsoft-fieldset">
          <div class="social-login-buttons roomly-microsoft-only">
            <button type="button" data-attr="data-username:data.microsoft_login_url" class="btn icon-microsoft roomly-microsoft-btn" data-social-provider="microsoft" aria-describedby="microsoft-login-status" disabled data-i18n>Sign in with Microsoft</button>
            <p id="microsoft-login-status" class="comment" data-microsoft-status role="status">Microsoft SSO ยังไม่พร้อมใช้งาน กรุณาติดต่อผู้ดูแลระบบ</p>
          </div>
        </fieldset>
      </div>
    </section>
  </form>
</div>
