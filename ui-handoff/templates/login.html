<div class="roomly-login-page">
  <form data-form="login" class="auth-form roomly-login-shell" novalidate action="api/index/auth/login" method="post" data-ajax-submit="true" data-redirect="/" data-auto-fill-intended-url="true"
        data-load-api="api/index/config/login" data-load-cache="true" data-load-cache-time="300000">
    <section class="roomly-login-panel">
      <div class="roomly-login-utilities">
        <button class="roomly-language-toggle" type="button" data-roomly-language-toggle aria-label="Switch language">
          <span class="roomly-language-icon icon-language"></span><span class="roomly-language-option roomly-language-th">TH</span><span class="roomly-language-divider">/</span><span class="roomly-language-option roomly-language-en">EN</span>
        </button>
        <button class="roomly-icon-button roomly-theme-toggle" type="button" data-roomly-theme-toggle aria-label="Toggle theme">
          <span class="roomly-theme-glyph roomly-theme-moon icon-night"></span><span class="roomly-theme-glyph roomly-theme-sun icon-day"></span>
        </button>
      </div>
      <div class="roomly-login-form-card">
        <div class="auth-header roomly-login-header">
          <a href="/" class="roomly-login-brand" aria-label="{LNG_ระบบจองห้องคณะสัตวแพทยศาสตร์}">
            <img class="roomly-brand-logo roomly-login-brand-logo" src="/ui-handoff/images/logo.png" alt="{LNG_ระบบจองห้องคณะสัตวแพทยศาสตร์}">
          </a>
          <h1 class="roomly-login-title" data-i18n>ระบบจองห้องคณะสัตวแพทยศาสตร์</h1>
          <p class="login-message" data-i18n>Welcome back! Please login to proceed.</p>
        </div>
      <fieldset class="roomly-login-fields">
        <div>
          <label for="login_username" data-i18n>{LNG_Username}/{LNG_Email}</label>
          <span class="form-control icon-email">
            <input maxlength="50" type="text" id="login_username" name="username" autocomplete="username" autofocus data-persist="local" data-persist-key="login_username"
                   data-persist-ttl-days="30" autofocus>
          </span>
        </div>
        <div>
          <label for="login_password" data-i18n>Password</label>
          <span class="form-control icon-password">
            <input maxlength="50" type="password" id="login_password" name="password" autocomplete="current-password">
          </span>
        </div>
        <div>
          <div class="form-group roomly-login-options">
            <div class="width50">
              <!-- remember checkbox: example also marked to persist its state -->
              <input type="checkbox" id="remember" class="switch" name="remember" value="1" data-persist="local" data-persist-key="login_remember">
              <label for="remember" data-i18n>Remember Me</label>
            </div>
            <div class="width50 right" data-if="data.user_forgot === 1">
              <a href="forgot" data-i18n>Forgot Password</a>
            </div>
          </div>
        </div>
      </fieldset>
      <fieldset class="center roomly-login-submit">
        <button type="submit" class="btn btn-primary fullwidth large icon-signin" data-i18n>Log in</button>
      </fieldset>
      <!-- Social Login Divider -->
      <div class="social-divider" data-if="data.user_register === 1">
        <span data-i18n>Or continue with</span>
      </div>
      <!-- Social Login Buttons -->
      <fieldset class="center" data-if="data.user_register === 1 || data.demo_mode === 1">
        <div class="social-login-buttons">
          <div data-attr="data-username:data.google_client_id" data-social-provider="google"></div>
          <button type="button" data-attr="data-username:data.line_channel_id" class="btn icon-line" data-social-provider="line" data-i18n>LINE</button>
          <button type="button" data-attr="data-username:data.facebook_appId" class="btn icon-facebook" data-social-provider="facebook" data-i18n>Facebook</button>
          <div data-attr="data-username:data.telegram_bot_username" data-social-provider="telegram"></div>
        </div>
      </fieldset>
      <div class="center roomly-login-register" data-if="data.user_register === 1">
        <span data-i18n>Don't have an account?</span> <a href="register" data-i18n>Sign up</a>
      </div>
      </div>
    </section>
  </form>
</div>
