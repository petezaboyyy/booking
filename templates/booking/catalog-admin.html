<aside data-component='sidebar'></aside>
<div class='main-content'>
  <div>
    <header data-component='topbar'></header>
    <main class='content'>
      <div class='card-groups booking-catalog-page' data-component='api' data-endpoint='api/booking/catalog/lists' data-refresh-event='locale:changed'>
        <header>
          <div>
            <h1 class='icon-office' data-i18n>All rooms</h1>
            <p data-i18n>Browse rooms and choose a room for your reservation</p>
          </div>
          <div class='header-actions'>
            <a class='btn btn-warning icon-list' href='/my-bookings' data-i18n>My bookings</a>
            <a class='btn btn-primary icon-edit' href='/booking' data-i18n>Open booking form</a>
          </div>
        </header>
        <div class='content-body'>
          <div class='booking-catalog-layout'>
            <!-- Skeleton Loading Grid -->
            <section class='booking-catalog-grid booking-catalog-skeleton-grid' aria-hidden='true'>
              <article class='booking-catalog-card is-skeleton'>
                <div class='booking-catalog-card-media skeleton-shimmer'></div>
                <div class='booking-catalog-card-body'>
                  <div style='display:flex;flex-direction:column;gap:0.5rem;height:3.5rem;'>
                    <div class='skeleton-shimmer skeleton-bar' style='height:1.2rem;width:80%;'></div>
                    <div class='skeleton-shimmer skeleton-bar' style='height:1rem;width:50%;'></div>
                  </div>
                  <div>
                    <div class='skeleton-shimmer skeleton-bar' style='height:0.9rem;width:40%;margin-bottom:0.4rem;'></div>
                    <div class='skeleton-shimmer skeleton-bar' style='height:0.9rem;width:65%;'></div>
                  </div>
                </div>
                <div class='booking-catalog-actions'>
                  <div class='skeleton-shimmer skeleton-btn-sm' style='flex:1;height:2.25rem;'></div>
                  <div class='skeleton-shimmer skeleton-btn-sm' style='flex:1;height:2.25rem;'></div>
                </div>
              </article>
              <article class='booking-catalog-card is-skeleton'>
                <div class='booking-catalog-card-media skeleton-shimmer'></div>
                <div class='booking-catalog-card-body'>
                  <div style='display:flex;flex-direction:column;gap:0.5rem;height:3.5rem;'>
                    <div class='skeleton-shimmer skeleton-bar' style='height:1.2rem;width:75%;'></div>
                    <div class='skeleton-shimmer skeleton-bar' style='height:1rem;width:55%;'></div>
                  </div>
                  <div>
                    <div class='skeleton-shimmer skeleton-bar' style='height:0.9rem;width:45%;margin-bottom:0.4rem;'></div>
                    <div class='skeleton-shimmer skeleton-bar' style='height:0.9rem;width:60%;'></div>
                  </div>
                </div>
                <div class='booking-catalog-actions'>
                  <div class='skeleton-shimmer skeleton-btn-sm' style='flex:1;height:2.25rem;'></div>
                  <div class='skeleton-shimmer skeleton-btn-sm' style='flex:1;height:2.25rem;'></div>
                </div>
              </article>
              <article class='booking-catalog-card is-skeleton'>
                <div class='booking-catalog-card-media skeleton-shimmer'></div>
                <div class='booking-catalog-card-body'>
                  <div style='display:flex;flex-direction:column;gap:0.5rem;height:3.5rem;'>
                    <div class='skeleton-shimmer skeleton-bar' style='height:1.2rem;width:85%;'></div>
                    <div class='skeleton-shimmer skeleton-bar' style='height:1rem;width:45%;'></div>
                  </div>
                  <div>
                    <div class='skeleton-shimmer skeleton-bar' style='height:0.9rem;width:35%;margin-bottom:0.4rem;'></div>
                    <div class='skeleton-shimmer skeleton-bar' style='height:0.9rem;width:55%;'></div>
                  </div>
                </div>
                <div class='booking-catalog-actions'>
                  <div class='skeleton-shimmer skeleton-btn-sm' style='flex:1;height:2.25rem;'></div>
                  <div class='skeleton-shimmer skeleton-btn-sm' style='flex:1;height:2.25rem;'></div>
                </div>
              </article>
              <article class='booking-catalog-card is-skeleton'>
                <div class='booking-catalog-card-media skeleton-shimmer'></div>
                <div class='booking-catalog-card-body'>
                  <div style='display:flex;flex-direction:column;gap:0.5rem;height:3.5rem;'>
                    <div class='skeleton-shimmer skeleton-bar' style='height:1.2rem;width:70%;'></div>
                    <div class='skeleton-shimmer skeleton-bar' style='height:1rem;width:60%;'></div>
                  </div>
                  <div>
                    <div class='skeleton-shimmer skeleton-bar' style='height:0.9rem;width:50%;margin-bottom:0.4rem;'></div>
                    <div class='skeleton-shimmer skeleton-bar' style='height:0.9rem;width:70%;'></div>
                  </div>
                </div>
                <div class='booking-catalog-actions'>
                  <div class='skeleton-shimmer skeleton-btn-sm' style='flex:1;height:2.25rem;'></div>
                  <div class='skeleton-shimmer skeleton-btn-sm' style='flex:1;height:2.25rem;'></div>
                </div>
              </article>
            </section>
            <section class='booking-catalog-grid' data-if='items && items.length > 0' data-for='item in items'>
              <template>
                <article class='booking-catalog-card' data-attr='data-id:item.id'>
                  <a class='booking-catalog-card-trigger' href='/rooms' data-action='click.prevent:requestApi' data-api-url='api/booking/catalog/detail'
                     data-api-method='get' data-param-id='{id}'>
                    <div class='booking-catalog-card-media' data-if='item.first_image_url'>
                      <img src='{{item.first_image_url}}' alt='{{item.name}}' loading='lazy'>
                      <span class='booking-catalog-status' data-class='is-active:item.is_active == 1'
                            data-text="item.is_active == 1 ? '{LNG_Available}' : '{LNG_Unavailable}'"></span>
                    </div>
                    <div class='booking-catalog-card-media' data-if='!item.first_image_url'>
                      <div class='booking-catalog-placeholder icon-office'></div>
                      <span class='booking-catalog-status' data-class='is-active:item.is_active == 1'
                            data-text="item.is_active == 1 ? '{LNG_Available}' : '{LNG_Unavailable}'"></span>
                    </div>
                    <div class='booking-catalog-card-body'>
                      <h2 class='two_lines' data-text='item.name'></h2>
                      <div>
                        <p class='booking-catalog-card-subtitle' data-text='item.room_number'></p>
                        <div class='booking-catalog-description'>
                          <span data-text='item.building'></span>
                          <span data-text="item.seats ? item.seats + ' {LNG_Seats}' : ''"></span>
                        </div>
                      </div>
                      <div class='booking-catalog-equipment' data-if='item.accessories_text'>
                        <strong data-i18n>Room equipment</strong>
                        <span data-text='item.accessories_text'></span>
                      </div>
                    </div>
                  </a>
                  <div class='booking-catalog-actions'>
                    <button type='button' class='btn btn-secondary' data-action='click.prevent:requestApi' data-api-url='api/booking/catalog/detail'
                            data-api-method='get' data-param-id='{id}' data-i18n>View details</button>
                    <a class='btn btn-primary' data-attr='href:item.booking_url' data-i18n>Select this room</a>
                  </div>
                </article>
              </template>
            </section>
            <div class='booking-catalog-grid-empty' data-if='!items || items.length === 0'>
              <span class='icon-office'></span>
              <p data-i18n>No rooms are available for booking right now</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <footer class='footer'>
    <p class='center'>&copy; 2026 Admin Framework - Powered by <a href='https://nowjs.net'>Now.js</a></p>
  </footer>
</div>
